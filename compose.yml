services:
  db:
    image: postgres:18
    container_name: testapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: testapp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_AUTO_LOGIN: "True"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    entrypoint: ["/bin/sh", "-c", "echo 'db:5432:testdb:postgres:postgres' > /var/lib/pgadmin/servers.pass && chmod 600 /var/lib/pgadmin/servers.pass && /entrypoint.sh"]
    ports:
      - "8080:80"
    depends_on:
      - db

  app:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: app-api
    working_dir: /src/App
    volumes:
      - .:/src
    environment:
      ASPNETCORE_URLS: http://+:8090
      ConnectionStrings__Default: Host=db;Port=5432;Database=testdb;Username=postgres;Password=postgres
    ports:
      - "8090:8090"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "dotnet restore && dotnet build --no-restore -c Release && dotnet /src/App/bin/Release/net10.0/App.dll"

volumes:
  pgdata:
  pgadmin_data:
